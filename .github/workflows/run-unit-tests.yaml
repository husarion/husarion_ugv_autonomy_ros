---
name: Run unit tests

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Run unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7

      - name: Build and test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          vcs-repo-file-url: ${{ github.workspace }}/husarion_ugv_autonomy/docking_deps.repos
          target-ros2-distro: jazzy
          colcon-defaults: |
            {
              "build": {
                "packages-up-to": ["husarion_ugv_autonomy"],
                "cmake-args": ["-DCMAKE_BUILD_TYPE=Release"]
              },
              "test": {
                "packages-select": [
                    "husarion_ugv_autonomy",
                    "husarion_ugv_docking",
                    "husarion_ugv_navigation"
                ]
              }
            }
