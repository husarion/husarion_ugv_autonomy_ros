---
name: Run unit tests

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Run unit tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS
        uses: ros-tooling/setup-ros@v0.7
        with:
          use-ros2-testing: true

      - name: Build and test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          vcs-repo-file-url: ${{ github.workspace }}/husarion_ugv_autonomy/docking_deps.repos
          target-ros2-distro: humble
          colcon-defaults: |
            {
              "build": {
                "packages-up-to": [
                    "husarion_ugv_autonomy"
                ],
                "cmake-args": [
                    "-DCMAKE_BUILD_TYPE=Release",
                    "-DTEST_INTEGRATION=OFF"
                ]
              },
              "test": {
                "packages-select": [
                    "husarion_ugv_autonomy",
                    "husarion_ugv_docking",
                    "husarion_ugv_navigation"
                ]
              }
            }
