---
name: Build Docker

on:
  workflow_call:
    inputs:
      branch_name:
        description: Tag used in the docker image (branch/tag/commit).
        required: true
        type: string
      build_type:
        description: Is it a "development" or a "stable" release?
        required: true
        type: string
        default: development
      target_distro:
        description: In case of "stable" release specify the ROS distro of the existing docker image (eg.
          jazzy)
        type: string
        default: jazzy
      target_release:
        description: In case of "stable" release specify the version of the existing docker image (eg.
          1.0.12)
        type: string
        default: 0.0.0
      target_date:
        description: In case of "stable" release specify the date of the existing docker image in format
          YYYYMMDD (eg. 20220124)
        type: string
        default: '20131206'
  workflow_dispatch:
    inputs:
      build_type:
        description: Is it a "development" or a "stable" release?
        required: true
        default: development
        type: choice
        options:
          - development
          - stable
      target_distro:
        description: In case of "stable" release specify the ROS distro of the existing docker image (eg.
          jazzy)
        type: string
        default: jazzy
      target_release:
        description: In case of "stable" release specify the version of the existing docker image (eg.
          1.0.12)
        type: string
        default: 0.0.0
      target_date:
        description: In case of "stable" release specify the date of the existing docker image in format
          YYYYMMDD (eg. 20220124)
        type: string
        default: '20131206'
  repository_dispatch:
    types: [rebuild]


# Each architecture builds natively on its own runner and pushes by digest; a last job joins
# the two into one multi-arch tag. One emulated two-platform build ran the runner out of disk
# (no space left on device, 2026-11-16). This is the shape that built humble on 2026-01-08
# (5aec5b6, run 20815558963), with dev tags only: <distro>-<branch>-<sha7> and <distro>-<branch>.
# It never pushes <distro>-latest or a version tag.
env:
  REGISTRY_IMAGE: husarion/husarion-ugv-autonomy

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch_name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm64
            arch_name: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          echo "::notice title=disk ${{ matrix.arch_name }}::$(df -h --output=avail,target / | tail -1)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ROS_DISTRO=${{ inputs.target_distro || 'jazzy' }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "::notice title=digest ${{ matrix.arch_name }}::$digest"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch_name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge the manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the multi-arch tags
        working-directory: /tmp/digests
        run: |
          distro="${{ inputs.target_distro || 'jazzy' }}"
          branch="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          sha7="$(echo '${{ github.sha }}' | cut -c1-7)"
          tag="${{ env.REGISTRY_IMAGE }}:${distro}-${branch}-${sha7}"
          docker buildx imagetools create -t "$tag" -t "${{ env.REGISTRY_IMAGE }}:${distro}-${branch}" \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
          index="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "::notice title=image::${tag} ${index}"
          docker buildx imagetools inspect "$tag"
