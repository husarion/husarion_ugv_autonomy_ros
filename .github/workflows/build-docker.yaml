---
name: Build Docker

on:
  workflow_call:
    inputs:
      branch_name:
        description: Tag used in the docker image (branch/tag/commit).
        required: true
        type: string
      build_type:
        description: Is it a "development" or a "stable" release?
        required: true
        type: string
        default: development
      target_distro:
        description: In case of "stable" release specify the ROS distro of the existing docker image (eg.
          jazzy)
        type: string
        default: jazzy
      target_release:
        description: In case of "stable" release specify the version of the existing docker image (eg.
          1.0.12)
        type: string
        default: 0.0.0
      target_date:
        description: In case of "stable" release specify the date of the existing docker image in format
          YYYYMMDD (eg. 20220124)
        type: string
        default: '20131206'
  workflow_dispatch:
    inputs:
      build_type:
        description: Is it a "development" or a "stable" release?
        required: true
        default: development
        type: choice
        options:
          - development
          - stable
      target_distro:
        description: In case of "stable" release specify the ROS distro of the existing docker image (eg.
          jazzy)
        type: string
        default: jazzy
      target_release:
        description: In case of "stable" release specify the version of the existing docker image (eg.
          1.0.12)
        type: string
        default: 0.0.0
      target_date:
        description: In case of "stable" release specify the date of the existing docker image in format
          YYYYMMDD (eg. 20220124)
        type: string
        default: '20131206'
  repository_dispatch:
    types: [rebuild]


jobs:
  build-amd:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define tag
        id: vars
        run: echo "tag=latest" >> $GITHUB_OUTPUT

      - name: Build Docker Image (AMD64)
        uses: husarion-ci/ros-docker-img-action@v0.8
        with:
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          dockerfile: docker/Dockerfile
          main_branch_name: ros2
          repo_name: husarion-ugv-autonomy
          build_type: ${{ inputs.build_type }}
          ros_distro: ${{ inputs.target_distro }}
          platforms: linux/amd64
          target_distro: ${{ inputs.target_distro }}
          target_release: ${{ inputs.target_release }}
          target_date: ${{ inputs.target_date }}

      - name: Tag and push AMD64 image
        run: |
          docker tag husarion-ugv-autonomy:latest user/repo:latest-amd64
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push user/repo:latest-amd64


  build-arm:
    runs-on: ubuntu-24.04-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image (ARM64)
        uses: husarion-ci/ros-docker-img-action@v0.8
        with:
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          dockerfile: docker/Dockerfile
          main_branch_name: ros2
          repo_name: husarion-ugv-autonomy
          build_type: ${{ inputs.build_type }}
          ros_distro: ${{ inputs.target_distro }}
          platforms: linux/arm64
          target_distro: ${{ inputs.target_distro }}
          target_release: ${{ inputs.target_release }}
          target_date: ${{ inputs.target_date }}

      - name: Tag and push ARM64 image
        run: |
          docker tag husarion-ugv-autonomy:latest user/repo:latest-arm64
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push user/repo:latest-arm64


  merge-manifest:
    runs-on: ubuntu-24.04
    needs: [build-amd, build-arm]
    steps:
      - name: Create and push multi-arch manifest
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker manifest create user/repo:latest \
            --amend user/repo:latest-amd64 \
            --amend user/repo:latest-arm64
          docker manifest push user/repo:latest
