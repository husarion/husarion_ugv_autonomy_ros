---
name: Build multi-arch Docker image

on:
  push:
    branches:
      - humble
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release:
        description: Also push the release tags (humble-latest, humble-<version>, humble-<version>-<date>)
        type: boolean
        default: false

# Each architecture builds natively on its own runner and pushes by digest; the last job joins
# the digests into one multi-arch tag (same shape as run 20815558963 on 2026-01-08).
env:
  REGISTRY_IMAGE: husarion/husarion-ugv-autonomy
  ROS_DISTRO: humble
  PACKAGE_XML_PATH: husarion_ugv_autonomy/package.xml

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch_name: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm64
            arch_name: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch_name }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch_name }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch_name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge the manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the multi-arch tags
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RELEASE: ${{ github.ref_type == 'tag' || inputs.release }}
        run: |
          # Release tags are mutable pointers that robots pull; a plain branch build must not move them.
          branch="$(echo "$REF_NAME" | tr '/' '-')"
          sha7="${SHA:0:7}"
          tags=(-t "${REGISTRY_IMAGE}:${ROS_DISTRO}-${branch}-${sha7}" -t "${REGISTRY_IMAGE}:${ROS_DISTRO}-${branch}")

          if [ "$RELEASE" = "true" ]; then
            version="$(grep -oP '<version>\K[^<]+' "$PACKAGE_XML_PATH" | head -1)"
            [ -n "$version" ] || { echo "::error::no <version> in $PACKAGE_XML_PATH"; exit 1; }
            date="$(date +%Y%m%d)"
            tags+=(
              -t "${REGISTRY_IMAGE}:${ROS_DISTRO}-latest"
              -t "${REGISTRY_IMAGE}:${ROS_DISTRO}-${version}"
              -t "${REGISTRY_IMAGE}:${ROS_DISTRO}-${version}-${date}"
            )
          fi

          cd /tmp/digests
          docker buildx imagetools create "${tags[@]}" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${ROS_DISTRO}-${branch}-${sha7}"
