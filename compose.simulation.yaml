x-common-config:
  &common-config
  network_mode: host
  ipc: host

services:
  panther_gazebo:
    image: husarion/panther-gazebo:humble-2.1.1-20240828
    container_name: panther_gazebo
    <<: *common-config
    runtime: nvidia
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,display
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./config:/config
    command: >
      ros2 launch panther_gazebo simulation.launch.py
        components_config_path:=/config/components.yaml
        namespace:=panther

  navigation:
    build:
      context: .
      dockerfile: Dockerfile
    # image: husarion/navigation2:humble-1.1.16-20240927
    container_name: navigation
    <<: *common-config
    volumes:
      - ./husarion_ugv_navigation:/ros2_ws/src/husarion_ugv_navigation
      - ./maps:/maps
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - SAVE_MAP_PERIOD=${SAVE_MAP_PERIOD-10}
    command: >
      ros2 launch husarion_ugv_navigation bringup_launch.py
        namespace:=panther
        observation_topic:=velodyne_points
        observation_topic_type:=pointcloud
        map:=./maps/map.yaml
        slam:=True
        use_sim_time:=True
